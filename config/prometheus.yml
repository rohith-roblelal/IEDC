global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "alert.rules.yml"

scrape_configs:
  - job_name: "fastapi_backend"
    metrics_path: "/metrics"
    bearer_token_file: "/tmp/metrics_token"
    static_configs:
      - targets: ["backend:8000"]
