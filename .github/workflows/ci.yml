name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend CI
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: iedc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff black mypy bandit pip-audit pytest pytest-asyncio pytest-cov
        
    - name: Security Scan (pip-audit)
      run: pip-audit -r requirements.txt
      continue-on-error: false

    - name: Static Analysis (Bandit)
      run: bandit -r app/ -f json -o bandit-report.json
      continue-on-error: true

    - name: Lint (Ruff)
      run: ruff check .
      
    - name: Format (Black)
      run: black --check .
      continue-on-error: true
      
    - name: Type Check (MyPy)
      run: mypy .
      continue-on-error: true
      
    - name: Validate Migrations (Alembic)
      env:
        DATABASE_URL: postgresql+asyncpg://testuser:testpassword@localhost:5432/iedc_test
      run: |
        alembic upgrade head
        alembic downgrade -1
        alembic upgrade head
        
    - name: Run Pytest Suite with Coverage
      env:
        TEST_DATABASE_URL: postgresql+asyncpg://testuser:testpassword@localhost:5432/iedc_test
        REDIS_URL: redis://localhost:6379
        ENVIRONMENT: test
        JWT_SECRET: supersecretjwtkey
        FIRST_SUPERADMIN_PASSWORD: admin
      run: |
        pytest -v --cov=app --cov-report=xml --cov-fail-under=70
        
    - name: Upload Bandit Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-report
        path: backend/bandit-report.json

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: backend/coverage.xml

  frontend-build:
    name: Frontend CI
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
        
    - name: Install Dependencies
      run: npm ci
      
    - name: Security Scan (npm audit)
      run: npm audit
      continue-on-error: true
      
    - name: Lint (Frontend)
      run: npm run lint
      
    - name: Type Check (Frontend)
      run: npx tsc --noEmit
      
    - name: Production Build (Frontend)
      run: npm run build
