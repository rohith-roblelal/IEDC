name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: iedc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 mypy
        
    - name: Lint & Type Check (Backend)
      run: |
        # flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # We can add full mypy/flake8 later. For now just basic syntax check.
        python -m compileall .
        
    - name: Run Pytest Suite
      env:
        TEST_DATABASE_URL: postgresql+asyncpg://testuser:testpassword@localhost:5432/iedc_test
        ENVIRONMENT: test
        JWT_SECRET: supersecretjwtkey
      run: |
        pytest -v

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
        
    - name: Install Dependencies
      run: npm ci
      
    - name: Lint (Frontend)
      run: npm run lint
      
    - name: Type Check (Frontend)
      run: npx tsc --noEmit
      
    - name: Production Build (Frontend)
      run: npm run build
