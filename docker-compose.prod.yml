version: '3.8'

services:
  backend:
    build:
      context: ./backend
    restart: always
    environment:
      - ENVIRONMENT=production
      # All sensitive values should be provided via a secure .env file on the server
    depends_on:
      - db
      - redis
      - tempo

  worker:
    build:
      context: ./backend
    restart: always
    command: ["arq", "app.worker.WorkerSettings"]
    environment:
      - ENVIRONMENT=production
      # Sensitive values are provided via the server's .env file
    depends_on:
      - db
      - redis

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - grafana

  db:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-iedc_prod}
    # No exposed ports. Only accessible by backend within the docker network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: always
    # No exposed ports. Only accessible by backend within the docker network
    volumes:
      - redis_data:/data

  prometheus:
    image: prom/prometheus:latest
    restart: always
    environment:
      - METRICS_BEARER_TOKEN=${METRICS_BEARER_TOKEN:?METRICS_BEARER_TOKEN is required}
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        echo "$$METRICS_BEARER_TOKEN" > /tmp/metrics_token
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus

  grafana:
    image: grafana/grafana:latest
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD is required}
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    # No exposed ports. Only accessible via Caddy

  tempo:
    image: grafana/tempo:latest
    restart: always
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml
      - tempo_data:/tmp/tempo

  alertmanager:
    image: prom/alertmanager:latest
    restart: always
    environment:
      - ALERTMANAGER_SLACK_WEBHOOK=${ALERTMANAGER_SLACK_WEBHOOK:?ALERTMANAGER_SLACK_WEBHOOK is required}
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        echo "$$ALERTMANAGER_SLACK_WEBHOOK" > /tmp/slack_webhook
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  tempo_data:
  alertmanager_data:
